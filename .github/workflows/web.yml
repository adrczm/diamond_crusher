name: Mac web version

# Builds the web version for Safari on a Mac as a downloadable folder: the app files, a tiny local server that uses the
# Mac's own Perl, and a double-click launcher (see docs/mac.md). Pushes to main also publish the zip as a GitHub Release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Mac archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build
        run: npm run build:mac
      - name: Check the page loads nothing from other sites
        run: |
          if grep -rhoE "https?://[a-zA-Z0-9.-]+" dist/index.html | grep -v "^http://www.w3.org" ; then
            echo "index.html must only load the app's own files (DATA-010)."; exit 1
          fi
      - name: Check the local server serves the app
        run: |
          cd "build/Diamond Crusher"
          perl ./app-server.pl 47820 ./app &
          SERVER=$!
          sleep 1
          curl -sf http://127.0.0.1:47820/ | grep -q '<div id="root">'
          curl -sf -o /dev/null http://127.0.0.1:47820/sql-wasm.wasm
          curl -sf http://127.0.0.1:47820/settings | grep -q '<div id="root">'
          if curl -s --path-as-is http://127.0.0.1:47820/../../../../etc/passwd | grep -q root:; then
            echo "The server must only serve the app folder."; exit 1
          fi
          kill $SERVER
      - name: Name the archive
        id: name
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE="diamond-crusher-mac-${VERSION}-build${{ github.run_number }}.zip"
          mv "build/diamond-crusher-mac-${VERSION}.zip" "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # The zip keeps the launcher's executable bit; GitHub wraps artifacts in another zip, so unzip twice.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 30
      - name: Publish a release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-build-${{ github.run_number }}
          name: Diamond Crusher for Mac ${{ steps.name.outputs.version }} (build ${{ github.run_number }})
          body: |
            Download the zip, unzip it, and double-click "Start Diamond Crusher". See docs/mac.md.
            Save a backup file in the app before replacing an older folder.
          files: ${{ steps.name.outputs.file }}
