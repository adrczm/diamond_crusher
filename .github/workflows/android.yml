name: Android APK

# Builds an installable APK on every push and pull request (09 ARCH-060 to ARCH-064).
# Pushes to main also publish the APK as a GitHub Release, so it can be downloaded straight to the phone.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: Type-check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  apk:
    name: Build APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      DC_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Use the release key, if one is set up
        env:
          KEYSTORE_BASE64: ${{ secrets.DC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "DC_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the release key from the repository secrets."
          else
            echo "No release key set up; signing with the build template key (see docs/install.md)."
          fi
      - name: Build
        working-directory: android
        env:
          DC_KEYSTORE_PASSWORD: ${{ secrets.DC_KEYSTORE_PASSWORD }}
          DC_KEY_ALIAS: ${{ secrets.DC_KEY_ALIAS }}
          DC_KEY_PASSWORD: ${{ secrets.DC_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        id: name
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE="diamond-crusher-${VERSION}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check the APK has no internet permission
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions "${{ steps.name.outputs.file }}" | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "The release APK must not request INTERNET (DATA-010)."; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 30
      - name: Publish a release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Diamond Crusher ${{ steps.name.outputs.version }} (build ${{ github.run_number }})
          body: |
            Installable APK for Android. See docs/install.md for how to install it.
            Save a backup file in the app before installing an update.
          files: ${{ steps.name.outputs.file }}
